services:
  # Database Layer: PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: ayurdiet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ayurdiet_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ayurdiet_password}
      POSTGRES_DB: ${DB_NAME:-ayurdiet_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ayurdiet_user} -d ${DB_NAME:-ayurdiet_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Vector Database: Qdrant Knowledge Base Layer
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ayurdiet-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200 OK\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # AI Service: Python / FastAPI
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ayurdiet-ai-service
    restart: unless-stopped
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    environment:
      AI_SERVICE_PORT: 8000
      BACKEND_URL: http://backend:5000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data:/data:ro
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Application Backend: Node.js / Express
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ayurdiet-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER:-ayurdiet_user}:${DB_PASSWORD:-ayurdiet_password}@postgres:5432/${DB_NAME:-ayurdiet_db}
      AI_SERVICE_URL: http://ai-service:8000
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Frontend: React.js / Vite
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ayurdiet-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: http://backend:5000
      VITE_API_URL: http://localhost:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5173', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  qdrant_data:
  uploads_data:
